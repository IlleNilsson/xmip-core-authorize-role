[package]
name = "xmip-core-authorize-role"
version.workspace = true
edition.workspace = true
license.workspace = true
repository = "https://github.com/IlleNilsson/xmip-core-authorize-role"
description = "Role authorization: assigns roles to an identity from its Party, its recorded value, a claim it carries or the organizational unit of its name, and can refuse an identity that holds none. A xmip-core-authorize technology."
publish.workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
# A Technology depends on its parent Capability, never the reverse
# (repository-model.md). The facts it judges are context's and the layer it
# answers for is core's; standard library otherwise.
authorize = { workspace = true }
context = { workspace = true }
xcore = { workspace = true }

[lints]
workspace = true
